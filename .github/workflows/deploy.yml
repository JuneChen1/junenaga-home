name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 也可以在 GitHub 的 Actions 頁面手動執行
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # 部署不取消，避免部署到一半被中斷
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # 純靜態網站，不需要建置；public/ 資料夾的內容就是整個網站
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
